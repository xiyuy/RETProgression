# Global variable for run identification
run_id: 1  # Change this to create different experiment runs

caching:
  enabled: true
  prefetch_factor: 2
  train_cache_size: 1000
  val_cache_size: 1000
  
criterion:
  alpha: 0.25
  weight_method: inverse_frequency 
  gamma: 2.0
  type: cross_entropy
  use_class_weights: true
  
data:
  annotations_file_name: /projects/retprogression/gradable_dr/clean_gradable_dr_${run_id}_
  augmentation:
    enabled: true
    strength: moderate
  batch_size: 32
  class_labels: gradable_binary_DR
  data_dir: /projects/retprogression/
  img_dir: cropped_dataset_07082025
  num_workers: 7
  resolution: 224
  shuffle: true
  weighted_sampler:
    enabled: false
    generator_seed: 42
    target_minority_ratio: 0.20
    
distributed:
  backend: nccl
  world_size: 1
  
early_stopping:
  enabled: false
  metric: f1_score
  min_delta: 0.001
  mode: max
  patience: 8
  
exp:
  checkpoint_dir: /projects/retprogression/rgarridogarcia/checkpoints/referable_GPU1_experiment_${run_id}
  checkpoint_freq: 1
  checkpoint_name: null
  experiment_name: baseline
  master_port: 12345
  num_epochs: 1

########################## 1024 ##########################
experiment_res_1024:
  data:
    augmentation:
      enabled: false
      type: none
    batch_size: 10
    resolution: 1024
    img_dir: complete_cropped_1024_centered_wt_10272025_allRight
  exp:
    checkpoint_dir: /projects/retprogression/rgarridogarcia/checkpoints/cropped1024_cropped_centered_wt_allR_${run_id}
    checkpoint_name: ''
    experiment_name: swinv2_res1024
    num_epochs: 25
  lr_scheduler:
    type: cosine
    warmup:
      enabled: true
      min_lr: 1.0e-07
      warmup_proportion: 0.15
  model:
    img_size: 1024
    name: swinv2_large_window12to16_192to256.ms_in22k_ft_in1k
    pretrained: true  # ← ADD THIS
    num_classes: 2    # ← ADD THIS
  optimization:
    amp_enabled: true
    gradient_accumulation_steps: 16
    gradient_clipping: 0.5
  optimizer:
    optimizer:
    name: adam              # ADD THIS
    lr: 5.0e-06
    weight_decay: 0.001     # ADD THIS
    momentum: 0.9           # ADD THIS (though not used by Adam)

